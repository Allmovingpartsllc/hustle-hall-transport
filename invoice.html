<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Invoice | Hustle Hall Transport</title>
<link rel="stylesheet" href="style.css?v=ux-2">
<style>
:root{--pink:#e82d7c;--ink:#121212;--muted:#666;--paper:#fff;--soft:#f5f5f7}
*{box-sizing:border-box}body{margin:0;background:#eceef2;color:var(--ink);font-family:Arial,Helvetica,sans-serif}
.toolbar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;gap:1rem;padding:.8rem max(1rem,calc((100vw - 900px)/2));background:#111;border-bottom:3px solid var(--pink)}
.toolbar div{display:flex;gap:.6rem}.page-error{max-width:850px;margin:.6rem auto 0;padding:0 1rem;color:#a00;font-weight:700}
.invoice{width:min(850px,calc(100% - 2rem));margin:1rem auto 3rem;padding:2.2rem;background:var(--paper);box-shadow:0 10px 35px rgba(0,0,0,.12)}
.loading{padding:4rem;text-align:center}.head{display:flex;justify-content:space-between;gap:2rem;align-items:flex-start;padding-bottom:1.2rem;border-bottom:4px solid var(--pink)}
.brand{display:flex;gap:1rem;align-items:center}.brand img{width:155px;max-height:95px;object-fit:contain;background:#080808;border-radius:.6rem}.brand div{display:grid;gap:.15rem}.brand span{font-size:.8rem;color:var(--muted)}
.title{text-align:right}.title h1{margin:0 0 .4rem;font-size:2.35rem;letter-spacing:.06em}.status{display:inline-block;padding:.35rem .6rem;border-radius:999px;background:#111;color:#fff;font-size:.72rem;font-weight:900;letter-spacing:.08em}.status.paid{background:#137a43}
.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem;margin:1.25rem 0}.meta div{display:grid;gap:.25rem}.meta span,.label{font-size:.7rem;font-weight:900;color:var(--pink);letter-spacing:.08em}.meta strong{font-size:.9rem}
.parties{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin:1rem 0}.card{background:var(--soft);border-radius:.8rem;padding:1rem}.card h2{margin:.35rem 0;font-size:1.15rem}.card p{margin:.2rem 0;color:var(--muted);font-size:.9rem}
.items{margin-top:1.3rem;border:1px solid #ddd;border-radius:.7rem;overflow:hidden}.rowhead,.row{display:grid;grid-template-columns:1fr 150px 110px;gap:.8rem;align-items:center}.rowhead{background:#111;color:#fff;padding:.7rem 1rem;font-size:.78rem;font-weight:800}.row{padding:1rem}.row div{display:grid;gap:.3rem}.row small{color:var(--muted)}.row>span,.row>strong{text-align:right}
.totals{width:min(360px,100%);margin:1rem 0 1rem auto}.total{display:flex;justify-content:space-between;padding:.55rem .8rem}.due{background:#fff0f6;color:#c2185b;border-radius:.55rem;font-size:1.12rem}
.notes{padding:.9rem 0;border-top:1px solid #ddd;border-bottom:1px solid #ddd}.notes p{white-space:pre-wrap}.paybox{display:grid;grid-template-columns:1fr auto;gap:1.5rem;align-items:center;padding:1rem;border:2px solid var(--pink);border-radius:.85rem}.paybox h2{margin:.3rem 0}.paybox p{margin:.35rem 0;color:var(--muted)}.payurl{display:block;overflow-wrap:anywhere;color:#c2185b;font-size:.78rem;font-weight:700}
.qr{width:150px;height:150px;background:#fff;display:grid;place-items:center}.qr img,.qr canvas{max-width:150px;height:auto}.foot{display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap;margin-top:1.2rem;padding-top:.8rem;border-top:1px solid #ddd;color:var(--muted);font-size:.75rem}
@media(max-width:700px){.toolbar,.toolbar div{flex-direction:column}.invoice{width:calc(100% - 1rem);padding:1.15rem}.head{flex-direction:column}.title{text-align:left}.meta{grid-template-columns:1fr 1fr}.parties{grid-template-columns:1fr}.rowhead,.row{grid-template-columns:1fr 95px}.rowhead span:nth-child(2),.row>span{display:none}.paybox{grid-template-columns:1fr}}
@media print{@page{margin:.4in}body{background:#fff}.toolbar,.page-error{display:none!important}.invoice{width:100%;margin:0;padding:0;box-shadow:none}.brand img{width:130px}.paybox{break-inside:avoid}a{color:inherit;text-decoration:none}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
</head>
<body>
<div class="toolbar"><a class="button button-secondary" href="index.html">Hustle Hall</a><div><button class="button button-secondary" id="printBtn" disabled>Print / Save PDF</button><button class="button button-primary" id="payBtn" disabled>Pay invoice</button></div></div>
<p class="page-error" id="error" aria-live="polite"></p>
<main class="invoice" id="invoice"><div class="loading">Loading invoice…</div></main>
<script>
(function(){
  var root=document.getElementById('invoice'),err=document.getElementById('error'),printBtn=document.getElementById('printBtn'),payBtn=document.getElementById('payBtn');
  var p=new URLSearchParams(location.search),id=p.get('id'),token=p.get('token');
  var canonical=new URL('/invoice.html',location.origin); if(id)canonical.searchParams.set('id',id); if(token)canonical.searchParams.set('token',token);
  function esc(v){return String(v==null?'':v).replace(/[&<>'"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]})}
  function money(v){return '$'+Number(v||0).toFixed(2)}
  function date(v){if(!v)return 'Not specified';var d=new Date(v.length===10?v+'T12:00:00':v);return isNaN(d.getTime())?v:d.toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})}
  async function load(){if(!id||!token)throw new Error('This invoice link is incomplete.');var r=await fetch('/api/get-invoice?id='+encodeURIComponent(id)+'&token='+encodeURIComponent(token));var j=await r.json().catch(function(){return{}});if(!r.ok)throw new Error(j.error||'This invoice could not be loaded.');return j.invoice}
  function render(inv){
    var paid=inv.paymentStatus==='Paid'||inv.status==='Paid';document.title=inv.number+' | Hustle Hall Transport';
    root.innerHTML='<header class="head"><div class="brand"><img src="logo.png" alt="Hustle Hall Transport"><div><strong>Hustle Hall Transport</strong><span>Operated by AllMovingParts LLC</span><span>Hustle Hard. Deliver Smart.</span></div></div><div class="title"><h1>INVOICE</h1><span class="status '+(paid?'paid':'')+'">'+(paid?'PAID':'AMOUNT DUE')+'</span></div></header>'+
    '<section class="meta"><div><span>Invoice #</span><strong>'+esc(inv.number)+'</strong></div><div><span>Issue date</span><strong>'+date(inv.issuedAt)+'</strong></div><div><span>Due date</span><strong>'+date(inv.dueDate)+'</strong></div><div><span>Ride / order</span><strong>'+esc(inv.orderId)+'</strong></div></section>'+
    '<section class="parties"><div class="card"><span class="label">BILL TO</span><h2>'+esc(inv.billTo)+'</h2>'+(inv.customerName&&inv.customerName!==inv.billTo?'<p>Rider / customer: '+esc(inv.customerName)+'</p>':'')+(inv.customerEmail?'<p>'+esc(inv.customerEmail)+'</p>':'')+(inv.customerPhone?'<p>'+esc(inv.customerPhone)+'</p>':'')+'</div><div class="card"><span class="label">SERVICE PROVIDER</span><h2>Hustle Hall Transport</h2><p>Operated by AllMovingParts LLC</p><p>Palm Bay, Florida</p></div></section>'+
    '<section class="items"><div class="rowhead"><span>Description</span><span>Service date</span><span>Amount</span></div><div class="row"><div><strong>'+esc(inv.description)+'</strong>'+((inv.pickup||inv.delivery)?'<small>'+esc(inv.pickup||'')+((inv.pickup&&inv.delivery)?' → ':'')+esc(inv.delivery||'')+'</small>':'')+'</div><span>'+date(inv.serviceDate)+'</span><strong>'+money(inv.amount)+'</strong></div></section>'+
    '<section class="totals"><div class="total"><span>Total</span><strong>'+money(inv.amount)+'</strong></div><div class="total due"><span>'+(paid?'Paid':'Amount due')+'</span><strong>'+(paid?'$0.00':money(inv.amount))+'</strong></div></section>'+
    (inv.notes?'<section class="notes"><span class="label">NOTES</span><p>'+esc(inv.notes)+'</p></section>':'')+
    '<section class="paybox"><div><span class="label">'+(paid?'PAYMENT RECEIVED':'PAY THIS INVOICE')+'</span><h2>'+(paid?'Thank you. This invoice is paid.':'Pay securely online')+'</h2><p>'+(paid?'No balance is due.':'Scan the QR code or use the payment link below to open this invoice and pay securely.')+'</p>'+(!paid?'<a class="payurl" href="'+esc(canonical.toString())+'">'+esc(canonical.toString())+'</a>':'')+'</div>'+(!paid?'<div class="qr" id="qr"></div>':'')+'</section>'+
    '<footer class="foot"><strong>Hustle Hall Transport</strong><span>hustlehall.allmovingparts.com</span><span>Powered by AllMovingParts LLC</span></footer>';
    printBtn.disabled=false; payBtn.hidden=paid; payBtn.disabled=paid;
    if(!paid&&window.QRCode)new QRCode(document.getElementById('qr'),{text:canonical.toString(),width:150,height:150,colorDark:'#111111',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
  }
  printBtn.addEventListener('click',function(){window.print()});
  payBtn.addEventListener('click',async function(){payBtn.disabled=true;payBtn.textContent='Opening secure payment…';try{var r=await fetch('/api/create-invoice-checkout-session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id,token:token})});var j=await r.json().catch(function(){return{}});if(!r.ok||!j.url)throw new Error(j.error||'Payment could not be started.');location.assign(j.url)}catch(e){err.textContent=e.message||'Payment could not be started.';payBtn.disabled=false;payBtn.textContent='Pay invoice'}});
  load().then(render).catch(function(e){root.innerHTML='<div class="loading"><h1>Invoice unavailable</h1><p>'+esc(e.message)+'</p></div>';err.textContent=e.message});
})();
</script>
</body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account | Hustle Hall Transport</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head><body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><span class="brand-mark">HH</span><span>Hustle Hall <small>Transport</small></span></a><nav class="main-nav page-nav"><a href="index.html">Home</a><a href="tracking.html">Track Order</a></nav></div></header><main class="page-main"><div class="container auth-layout"><div><p class="eyebrow">Hustle Hall account</p><h1 class="page-title">Create your account.</h1><p class="page-intro">Save bookings, receipts, and your order history securely.</p></div><div class="auth-card"><form data-signup-form><label>Full name<input name="name" autocomplete="name" required></label><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" autocomplete="new-password" minlength="6" required></label><label>Confirm password<input name="confirmPassword" type="password" autocomplete="new-password" minlength="6" required></label><p class="auth-message" data-auth-message aria-live="polite"></p><button class="button button-primary" type="submit">Create account</button></form><p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p></div></div></main></body></html>
